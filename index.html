<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语练习">
<meta name="theme-color" content="#0f1117">
<title>英语语音练习</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#181c27;--card2:#1e2235;--border:#2a2f45;--accent:#4f8ef7;--green:#3ecf8e;--orange:#f5a623;--red:#f05252;--text:#e8eaf2;--text2:#8b90a8;--text3:#4a506a;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;overflow:hidden;-webkit-font-smoothing:antialiased;}

/* SETUP */
#setup{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-top) + 36px) 24px calc(var(--safe-bot) + 36px);display:flex;flex-direction:column;align-items:center;}
.si{width:100%;max-width:400px;}
.slogo{text-align:center;margin-bottom:28px;}
.sicon{width:64px;height:64px;background:linear-gradient(135deg,#4f8ef7,#7b5ea7);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.8rem;box-shadow:0 8px 24px rgba(79,142,247,0.3);}
.slogo h1{font-size:1.3rem;font-weight:500;margin-bottom:4px;}
.slogo p{font-size:0.7rem;color:var(--text2);}
.sc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
.slbl{font-size:0.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.fd{margin-bottom:10px;}
.fd:last-child{margin-bottom:0;}
.fd label{display:block;font-size:.68rem;color:var(--text2);margin-bottom:5px;}
input,select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Mono',monospace;font-size:.84rem;padding:11px 13px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s;}
input:focus,select:focus{border-color:var(--accent);}
.tc{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sbtn{width:100%;background:linear-gradient(135deg,#4f8ef7,#7b5ea7);color:white;border:none;border-radius:13px;font-family:'DM Mono',monospace;font-size:.88rem;font-weight:500;padding:15px;cursor:pointer;margin-top:4px;box-shadow:0 4px 18px rgba(79,142,247,0.35);-webkit-appearance:none;}
.sbtn:active{opacity:.85;}
.sbtn:disabled{opacity:.4;}
.err{background:rgba(240,82,82,.1);border:1px solid rgba(240,82,82,.3);border-radius:10px;padding:11px 13px;font-size:.76rem;color:var(--red);display:none;margin-top:10px;line-height:1.5;}
.snote{font-size:.62rem;color:var(--text3);text-align:center;margin-top:14px;line-height:1.7;}

/* APP */
#app{display:none;flex-direction:column;height:100%;height:-webkit-fill-available;}
.ah{padding:calc(var(--safe-top) + 10px) 16px 10px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.ai{width:32px;height:32px;background:linear-gradient(135deg,#4f8ef7,#7b5ea7);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;}
.at{flex:1;}
.at h2{font-size:.88rem;font-weight:500;}
.at span{font-size:.6rem;color:var(--text2);}
.hb{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;-webkit-appearance:none;}
.tb{padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;scrollbar-width:none;}
.tb::-webkit-scrollbar{display:none;}
.ch{flex-shrink:0;padding:5px 13px;border-radius:18px;font-size:.7rem;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:var(--card);white-space:nowrap;-webkit-appearance:none;transition:all .15s;}
.ch.active{background:rgba(79,142,247,.12);border-color:var(--accent);color:var(--accent);}
#log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:12px;}
.es{margin:auto;text-align:center;padding:50px 20px;}
.es .eg{font-size:3.5rem;opacity:.12;margin-bottom:16px;}
.es p{font-size:.76rem;color:var(--text3);line-height:1.9;}
.mg{animation:fu .25s ease;}
@keyframes fu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.rl{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500;margin-bottom:6px;padding-left:2px;}
.rl.you{color:var(--accent);}
.rl.gpt{color:var(--green);}
.bb{border-radius:13px;padding:12px 15px;font-size:.86rem;line-height:1.7;}
.bb.you{background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.18);}
.bb.gpt{background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.18);}
.fbc{margin-top:7px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:11px;padding:12px 14px;font-size:.78rem;}
.fbh{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:9px;font-weight:500;}
.fbi{margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--border);}
.fbi:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.fbt{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.fbw{color:var(--red);text-decoration:line-through;font-style:italic;}
.fbr{color:var(--green);font-weight:500;margin-top:2px;}
.fbb{color:var(--accent);font-weight:500;}
.fbn{color:var(--text2);font-size:.72rem;margin-top:3px;line-height:1.5;}
.rpb{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-family:'DM Mono',monospace;font-size:.68rem;cursor:pointer;margin-top:7px;-webkit-appearance:none;}
.thr{display:flex;align-items:center;gap:9px;font-size:.7rem;color:var(--text3);padding:6px 2px;}
.ds span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:3px;animation:db 1s infinite;opacity:.4;}
.ds span:nth-child(2){animation-delay:.15s;}
.ds span:nth-child(3){animation-delay:.3s;}
@keyframes db{0%,100%{transform:translateY(0);opacity:.3;}50%{transform:translateY(-4px);opacity:1;}}
#vb{flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding:12px 24px calc(var(--safe-bot) + 16px);}
.vs{text-align:center;font-size:.68rem;color:var(--text3);margin-bottom:9px;min-height:17px;transition:color .3s;}
.vs.rec{color:var(--red);}
.vs.proc{color:var(--accent);}
.vs.speak{color:var(--green);}
.lt{text-align:center;font-size:.78rem;color:var(--text2);font-style:italic;min-height:18px;margin-bottom:10px;padding:0 14px;line-height:1.5;}
.wr{display:flex;align-items:center;justify-content:center;gap:4px;height:32px;margin-bottom:10px;}
.wb{width:4px;background:var(--accent);border-radius:3px;height:4px;opacity:.5;transition:height .08s;}
.mw{display:flex;justify-content:center;}
#mb{width:70px;height:70px;border-radius:50%;border:2px solid var(--border);background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.4);-webkit-appearance:none;transition:all .2s;}
#mb.recording{background:var(--red);border-color:var(--red);animation:mp 1.4s ease infinite;}
#mb.recording svg{fill:white;}
#mb.disabled{opacity:.35;}
@keyframes mp{0%{box-shadow:0 0 0 0 rgba(240,82,82,.5);}70%{box-shadow:0 0 0 16px rgba(240,82,82,0);}100%{box-shadow:0 0 0 0 rgba(240,82,82,0);}}
.mh{text-align:center;font-size:.6rem;color:var(--text3);margin-top:8px;letter-spacing:.05em;}

/* Settings sheet */
#ss{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);display:none;align-items:flex-end;}
#ss.open{display:flex;}
.ssi{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:18px 22px calc(var(--safe-bot) + 22px);border-top:1px solid var(--border);}
.ssh{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.sst{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
.sf{margin-bottom:12px;}
.sf label{display:block;font-size:.66rem;color:var(--text2);margin-bottom:5px;}
.sdn{width:100%;background:var(--accent);color:white;border:none;border-radius:11px;padding:13px;font-family:'DM Mono',monospace;font-size:.84rem;cursor:pointer;margin-top:6px;-webkit-appearance:none;}
</style>
</head>
<body>

<div id="setup">
  <div class="si">
    <div class="slogo">
      <div class="sicon">🎙️</div>
      <h1>英语语音练习</h1>
      <p>AI English Voice Coach · Powered by ChatGPT</p>
    </div>
    <div class="sc">
      <div class="slbl">OpenAI API Key</div>
      <div class="fd">
        <input type="password" id="ak" placeholder="sk-..." autocomplete="off"/>
      </div>
      <div style="font-size:.65rem;color:var(--text3);line-height:1.7">Key仅存储本设备，不会上传任何服务器<br>获取：platform.openai.com/api-keys</div>
    </div>
    <div class="sc">
      <div class="slbl">设置</div>
      <div class="tc">
        <div class="fd"><label>GPT 模型</label>
          <select id="gm"><option value="gpt-4o">GPT-4o ⭐</option><option value="gpt-4o-mini">GPT-4o mini</option><option value="gpt-3.5-turbo">GPT-3.5</option></select>
        </div>
        <div class="fd"><label>AI 声音</label>
          <select id="tv"><option value="nova">Nova 女声</option><option value="shimmer">Shimmer 柔和</option><option value="alloy">Alloy 中性</option><option value="echo">Echo 男声</option><option value="fable">Fable 英式</option><option value="onyx">Onyx 低沉</option></select>
        </div>
      </div>
      <div class="fd"><label>英语水平</label>
        <select id="ml"><option value="beginner">初学者 (A1-A2)</option><option value="elementary">基础 (B1)</option><option value="intermediate" selected>中级 (B2)</option><option value="advanced">高级 (C1-C2)</option></select>
      </div>
    </div>
    <div id="er" class="err"></div>
    <button class="sbtn" id="stb" onclick="startApp()">开始练习 →</button>
    <div class="snote">Safari打开 → 分享 → 添加到主屏幕</div>
  </div>
</div>

<div id="app">
  <div class="ah">
    <div class="ai">🎙️</div>
    <div class="at"><h2>英语语音练习</h2><span id="mt">gpt-4o · nova · 1x</span></div>
    <div style="display:flex;gap:7px">
      <button class="hb" onclick="clearChat()">🗑</button>
      <button class="hb" onclick="openSettings()">⚙️</button>
    </div>
  </div>
  <div class="tb">
    <button class="ch active" data-topic="free"      onclick="setTopic(this)">💬 自由聊天</button>
    <button class="ch"        data-topic="daily"     onclick="setTopic(this)">☀️ 日常生活</button>
    <button class="ch"        data-topic="work"      onclick="setTopic(this)">💼 职场英语</button>
    <button class="ch"        data-topic="travel"    onclick="setTopic(this)">✈️ 旅行</button>
    <button class="ch"        data-topic="interview" onclick="setTopic(this)">🎯 面试练习</button>
    <button class="ch"        data-topic="debate"    onclick="setTopic(this)">🗣 辩论观点</button>
  </div>
  <div id="log">
    <div class="es" id="empty">
      <div class="eg">🎤</div>
      <p>按住下方麦克风说英语<br>AI 会自动回复并纠正语法<br>松开即发送</p>
    </div>
  </div>
  <div id="vb">
    <div class="vs" id="vs">准备好了，按住麦克风开始说话</div>
    <div class="lt" id="lt"></div>
    <div class="wr">
      <div class="wb" id="w1"></div><div class="wb" id="w2"></div><div class="wb" id="w3"></div>
      <div class="wb" id="w4"></div><div class="wb" id="w5"></div><div class="wb" id="w6"></div><div class="wb" id="w7"></div>
    </div>
    <div class="mw">
      <button id="mb" onpointerdown="startRec(event)" onpointerup="stopRec(event)" onpointercancel="stopRec(event)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#8b90a8">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-7 10a7 7 0 0 0 14 0h-2a5 5 0 0 1-10 0H5zm7 9v-3h-2v3H7v2h10v-2h-3z"/>
        </svg>
      </button>
    </div>
    <div class="mh">按住说话，松开发送</div>
  </div>
</div>

<div id="ss" onclick="if(event.target===this)closeSettings()">
  <div class="ssi">
    <div class="ssh"></div>
    <div class="sst">设置</div>
    <div class="sf"><label>GPT 模型</label>
      <select id="sm" onchange="save('model',this.value)"><option value="gpt-4o">GPT-4o</option><option value="gpt-4o-mini">GPT-4o mini</option><option value="gpt-3.5-turbo">GPT-3.5</option></select>
    </div>
    <div class="sf"><label>AI 声音</label>
      <select id="sv" onchange="save('voice',this.value)"><option value="nova">Nova 女声</option><option value="shimmer">Shimmer 柔和</option><option value="alloy">Alloy 中性</option><option value="echo">Echo 男声</option><option value="fable">Fable 英式</option><option value="onyx">Onyx 低沉</option></select>
    </div>
    <div class="sf">
      <label>AI 语速 &nbsp;<span id="spv" style="color:var(--accent)">1.0x</span></label>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <span style="font-size:.66rem;color:var(--text3)">1.0</span>
        <input type="range" id="ssp" min="1.0" max="2.0" step="0.1" value="1.0" style="flex:1;accent-color:var(--accent);cursor:pointer" oninput="document.getElementById('spv').textContent=parseFloat(this.value).toFixed(1)+'x'" onchange="save('speed',this.value)">
        <span style="font-size:.66rem;color:var(--text3)">2.0</span>
      </div>
    </div>
    <div class="sf"><label>英语水平</label>
      <select id="sl" onchange="save('level',this.value)"><option value="beginner">初学者 (A1-A2)</option><option value="elementary">基础 (B1)</option><option value="intermediate">中级 (B2)</option><option value="advanced">高级 (C1-C2)</option></select>
    </div>
    <button class="sdn" onclick="closeSettings()">完成</button>
  </div>
</div>

<script>
// ── STATE ──
let apiKey='', gptModel='gpt-4o', ttsVoice='nova', ttsSpeed=1.0, userLevel='intermediate', topic='free';
let isRecording=false, isProcessing=false;
let mediaRecorder=null, audioChunks=[];
let history=[];
let audioCtx=null;
let waveTimer=null;

const TOPICS = {
  free:      'any topic the user brings up',
  daily:     'daily life: routines, food, hobbies, family',
  work:      'professional topics: jobs, career, workplace',
  travel:    'travel, tourism, destinations',
  interview: 'job interview — act as the interviewer',
  debate:    'opinions and debate — encourage the user to share views'
};
const LEVELS = {
  beginner:     'Use very simple vocabulary, short sentences (A1-A2). Avoid idioms.',
  elementary:   'Use simple to moderate vocabulary (B1).',
  intermediate: 'Use natural B2-level English with idioms and varied grammar.',
  advanced:     'Use sophisticated C1+ English freely.'
};

// ── SETUP ──
async function startApp() {
  const key = document.getElementById('ak').value.trim();
  if (!key.startsWith('sk-')) { showErr('请输入有效的 OpenAI API Key（sk- 开头）'); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { showErr('请用 Safari 浏览器打开'); return; }
  apiKey = key;
  gptModel = document.getElementById('gm').value;
  ttsVoice = document.getElementById('tv').value;
  userLevel = document.getElementById('ml').value;
  const btn = document.getElementById('stb');
  btn.disabled = true; btn.textContent = '连接中...';
  try {
    const r = await fetch('https://api.openai.com/v1/models', { headers: { 'Authorization': `Bearer ${apiKey}` } });
    if (!r.ok) throw new Error('API Key 无效');
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
    localStorage.setItem('ev_k', apiKey); localStorage.setItem('ev_m', gptModel);
    localStorage.setItem('ev_v', ttsVoice); localStorage.setItem('ev_l', userLevel);
    localStorage.setItem('ev_s', String(ttsSpeed));
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    updateTag();
  } catch(e) {
    showErr(e.message.includes('getUserMedia') || e.message.includes('Permission') ? '麦克风权限被拒绝，请在设置中允许 Safari 使用麦克风' : e.message);
    btn.disabled = false; btn.textContent = '开始练习 →';
  }
}
function showErr(m) { const e = document.getElementById('er'); e.textContent = m; e.style.display = 'block'; }

// ── RECORDING ──
async function startRec(e) {
  e.preventDefault();
  if (isProcessing || isRecording) return;
  // Unlock AudioContext inside user gesture - must fully complete before recording
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
  } catch(ex) {}
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    // iOS Safari supports audio/mp4
    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' :
                 MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    mediaRecorder.ondataavailable = ev => { if (ev.data.size > 0) audioChunks.push(ev.data); };
    mediaRecorder.start(100);
    isRecording = true;
    setSt('rec', '● 正在录音...');
    document.getElementById('lt').textContent = '';
    document.getElementById('mb').className = 'recording';
    document.getElementById('mb').querySelector('svg').setAttribute('fill', 'white');
    startWave();
  } catch(e) { setSt('', '麦克风错误: ' + e.message); }
}

async function stopRec(e) {
  e.preventDefault();
  if (!isRecording) return;
  isRecording = false;
  stopWave();
  document.getElementById('mb').className = 'disabled';
  document.getElementById('mb').querySelector('svg').setAttribute('fill', '#8b90a8');
  await new Promise(resolve => {
    mediaRecorder.onstop = resolve;
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  });
  const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/mp4' });
  if (blob.size < 1000) { setSt('', '录音太短，请重试'); resetMic(); return; }
  await transcribeAudio(blob);
}

function resetMic() {
  isProcessing = false;
  document.getElementById('mb').className = '';
  document.getElementById('mb').querySelector('svg').setAttribute('fill', '#8b90a8');
}

// ── WHISPER ──
async function transcribeAudio(blob) {
  isProcessing = true;
  setSt('proc', '◌ 识别语音...');
  try {
    // Send blob directly - try multiple filenames until one works
    const mimeType = mediaRecorder.mimeType || 'audio/mp4';
    const attempts = [
      { name: 'audio.wav',  type: 'audio/wav'  },
      { name: 'audio.m4a',  type: 'audio/mp4'  },
      { name: 'audio.mp4',  type: 'audio/mp4'  },
      { name: 'audio.webm', type: 'audio/webm' },
    ];

    let text = null;
    let lastErr = '';
    for (const a of attempts) {
      const sendBlob = new Blob(audioChunks, { type: a.type });
      const fd = new FormData();
      fd.append('file', sendBlob, a.name);
      fd.append('model', 'whisper-1');
      fd.append('language', 'en');
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}` },
        body: fd
      });
      if (r.ok) {
        const data = await r.json();
        text = data.text;
        break;
      }
      const err = await r.json().catch(() => ({}));
      lastErr = err.error?.message || `HTTP ${r.status}`;
      // If not a format error, stop trying
      if (!lastErr.includes('format') && !lastErr.includes('Invalid')) break;
    }

    if (!text?.trim()) {
      throw new Error(lastErr || '没有识别到内容');
    }
    document.getElementById('lt').textContent = `"${text.trim()}"`;
    await sendToGPT(text.trim());
  } catch(e) {
    setSt('', '错误: ' + e.message);
    resetMic();
  }
}

// ── GPT ──
async function sendToGPT(userText) {
  setSt('proc', '◌ GPT 思考中...');
  removeEmpty();
  const userEl = addBubble('you', userText);
  const thinking = addThinking();
  history.push({ role: 'user', content: userText });
  try {
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: gptModel,
        messages: [{ role: 'system', content: buildPrompt() }, ...history],
        max_tokens: 800, temperature: 0.75,
        response_format: { type: 'json_object' }
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error?.message || 'GPT error');
    let p;
    try { p = JSON.parse(data.choices[0].message.content); }
    catch { p = { reply: data.choices[0].message.content, corrections: [], better_expressions: [] }; }
    history.push({ role: 'assistant', content: p.reply });
    thinking.remove();
    if (p.corrections?.length || p.better_expressions?.length) addFeedback(userEl, p.corrections||[], p.better_expressions||[]);
    const replyEl = addBubble('gpt', p.reply);
    setSt('proc', '◌ 生成语音...');
    const ad = await fetchTTS(p.reply);
    if (ad) { addReplayBtn(replyEl, ad); await playAudio(ad); }
    else { setSt('', '准备好了，按住麦克风说话'); }
    document.getElementById('lt').textContent = '';
  } catch(e) {
    thinking.remove();
    addBubble('gpt', '⚠️ 错误: ' + e.message);
    setSt('', '发生错误，请重试');
  }
  resetMic();
}

function buildPrompt() {
  return `You are a friendly English conversation coach. Two jobs:
1. Have a natural conversation about: ${TOPICS[topic]}
2. Analyze the user's English and provide feedback.
Match language to level: ${LEVELS[userLevel]}
Respond ONLY in valid JSON (no markdown):
{"reply":"2-3 sentence response. Warm, engaging, end with follow-up question.","corrections":[{"original":"exact wrong phrase","fixed":"corrected","explanation":"brief reason"}],"better_expressions":[{"original":"correct but weak phrase","better":"more natural version","note":"why"}]}
corrections=actual errors only, if none use []. better_expressions=max 1-2, if none use [].`;
}

// ── TTS ──
async function fetchTTS(text) {
  try {
    const r = await fetch('https://api.openai.com/v1/audio/speech', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({ model: 'tts-1', voice: ttsVoice, input: text, speed: ttsSpeed })
    });
    if (!r.ok) throw new Error();
    const buf = await r.arrayBuffer();
    return { buf, text };
  } catch { return null; }
}

async function playAudio(ad) {
  if (!ad?.buf || !audioCtx) return;
  try {
    const buffer = await audioCtx.decodeAudioData(ad.buf.slice(0));
    const src = audioCtx.createBufferSource();
    src.buffer = buffer; src.connect(audioCtx.destination); src.start(0);
    setSt('speak', '▶ AI 正在说话...');
    await new Promise(resolve => { src.onended = resolve; });
    setSt('', '准备好了，按住麦克风说话');
  } catch { setSt('', '准备好了，按住麦克风说话'); }
}

// ── UI ──
function addBubble(role, text) {
  const log = document.getElementById('log');
  const el = document.createElement('div'); el.className = 'mg';
  el.innerHTML = `<div class="rl ${role}">${role==='you'?'你说':'GPT 回复'}</div><div class="bb ${role}">${esc(text)}</div>`;
  log.appendChild(el); scrollLog(); return el;
}

function addFeedback(entryEl, corrections, betterExps) {
  let h = `<div class="fbc"><div class="fbh">📝 语法反馈</div>`;
  corrections.forEach(c => { h += `<div class="fbi"><div class="fbt">❌ 错误纠正</div><div class="fbw">${esc(c.original)}</div><div class="fbr">✓ ${esc(c.fixed)}</div><div class="fbn">${esc(c.explanation)}</div></div>`; });
  betterExps.forEach(b => { h += `<div class="fbi"><div class="fbt">💡 更地道</div><div style="color:var(--text2)">"${esc(b.original)}"</div><div class="fbb">→ "${esc(b.better)}"</div><div class="fbn">${esc(b.note)}</div></div>`; });
  h += `</div>`; entryEl.insertAdjacentHTML('beforeend', h); scrollLog();
}

function addReplayBtn(el, ad) {
  const btn = document.createElement('button');
  btn.className = 'rpb'; btn.textContent = '↩ 重播';
  btn.onclick = () => playAudio(ad);
  el.appendChild(btn);
}

function addThinking() {
  const log = document.getElementById('log');
  const el = document.createElement('div'); el.className = 'thr';
  el.innerHTML = `<div class="ds"><span></span><span></span><span></span></div><span>GPT 思考中...</span>`;
  log.appendChild(el); scrollLog(); return el;
}

function removeEmpty() { document.getElementById('empty')?.remove(); }
function scrollLog() { const l = document.getElementById('log'); setTimeout(() => { l.scrollTop = l.scrollHeight; }, 50); }

// ── WAVE ──
function startWave() {
  const ids = ['w1','w2','w3','w4','w5','w6','w7'];
  waveTimer = setInterval(() => { ids.forEach(id => { const e = document.getElementById(id); if(e) e.style.height = (Math.random()*28+4)+'px'; }); }, 90);
}
function stopWave() {
  clearInterval(waveTimer);
  ['w1','w2','w3','w4','w5','w6','w7'].forEach(id => { const e = document.getElementById(id); if(e) e.style.height = '4px'; });
}

// ── HELPERS ──
function setSt(type, msg) { const e = document.getElementById('vs'); e.textContent = msg; e.className = 'vs' + (type ? ' '+type : ''); }
function updateTag() { document.getElementById('mt').textContent = `${gptModel} · ${ttsVoice} · ${ttsSpeed}x`; }
function setTopic(btn) { document.querySelectorAll('.ch').forEach(c => c.classList.remove('active')); btn.classList.add('active'); topic = btn.dataset.topic; clearChat(); }
function clearChat() { history = []; document.getElementById('log').innerHTML = '<div class="es" id="empty"><div class="eg">🎤</div><p>按住下方麦克风说英语<br>AI 会自动回复并纠正语法<br>松开即发送</p></div>'; }
function save(type, val) {
  if (type==='model') { gptModel=val; localStorage.setItem('ev_m',val); }
  if (type==='voice') { ttsVoice=val; localStorage.setItem('ev_v',val); }
  if (type==='speed') { ttsSpeed=parseFloat(val); localStorage.setItem('ev_s',val); }
  if (type==='level') { userLevel=val; localStorage.setItem('ev_l',val); }
  updateTag();
}
function openSettings() {
  document.getElementById('sm').value = gptModel; document.getElementById('sv').value = ttsVoice;
  document.getElementById('ssp').value = ttsSpeed; document.getElementById('spv').textContent = ttsSpeed.toFixed(1)+'x';
  document.getElementById('sl').value = userLevel; document.getElementById('ss').classList.add('open');
}
function closeSettings() { document.getElementById('ss').classList.remove('open'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── RESTORE SETTINGS ──
(function() {
  const k=localStorage.getItem('ev_k'), m=localStorage.getItem('ev_m'),
        v=localStorage.getItem('ev_v'), s=localStorage.getItem('ev_s'), l=localStorage.getItem('ev_l');
  if (k) document.getElementById('ak').value = k;
  if (m) { gptModel=m; document.getElementById('gm').value=m; }
  if (v) { ttsVoice=v; document.getElementById('tv').value=v; }
  if (s) ttsSpeed = parseFloat(s);
  if (l) { userLevel=l; document.getElementById('ml').value=l; }
  if (k && k.startsWith('sk-')) startApp();
})();

document.getElementById('ak').addEventListener('keydown', e => { if (e.key==='Enter') startApp(); });
</script>
